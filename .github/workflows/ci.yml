name: CI/CD

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Manual Terraform action"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy
  push:
    branches: [develop]
    paths:
      - "terraform/**"
      - "tests/**"
      - ".github/workflows/**"
      - "lambda/**"
      - "glue/**"
      - "scripts/empty_terraform_s3_buckets.sh"
      - "pyproject.toml"
      - ".tflint.hcl"
  pull_request:
    branches: [develop]
    paths:
      - "terraform/**"
      - "tests/**"
      - ".github/workflows/**"
      - "lambda/**"
      - "glue/**"
      - "scripts/empty_terraform_s3_buckets.sh"
      - "pyproject.toml"
      - ".tflint.hcl"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7"
  TF_ENV: "dev"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_REGION: "us-east-1"

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.terraform_action != 'destroy'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/test_validation.py -k "not slow" --tb=short

  static_checks:
    name: Static Checks
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.terraform_action != 'destroy'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static analysis tools
        run: pip install ruff checkov

      - name: Ruff
        run: ruff check .

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint --recursive --minimum-failure-severity=error

      - name: Checkov
        run: checkov -d terraform --quiet --compact --soft-fail

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [test, static_checks]
    if: github.event_name != 'workflow_dispatch' || inputs.terraform_action != 'destroy'
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials for Plan
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.P2_AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Format
        run: terraform fmt -check -recursive ../../..

      - name: Terraform Init
        run: |
          cp ../../../config/backend-dev.hcl.example backend-dev.hcl
          sed -i "s/YOUR_ACCOUNT_ID/${{ secrets.AWS_ACCOUNT_ID }}/" backend-dev.hcl
          sed -i "s/YOUR_STATE_BUCKET_NAME/${{ secrets.P2_TF_STATE_BUCKET }}/" backend-dev.hcl
          sed -i "s/YOUR_LOCK_TABLE_NAME/${{ secrets.P2_TF_LOCK_TABLE }}/" backend-dev.hcl
          sed -i "s|YOUR_KMS_KEY_ARN|${{ secrets.P2_TF_STATE_KMS_KEY_ARN }}|" backend-dev.hcl
          terraform init -backend-config=backend-dev.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -lock=false -no-color -out=tfplan -var="bucket_suffix=${{ secrets.AWS_ACCOUNT_ID }}"
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2-${{ env.TF_ENV }}-tfplan
          path: |
            terraform/envs/dev/tfplan
            terraform/envs/dev/tfplan.txt
          retention-days: 7

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/envs/dev/tfplan.txt', 'utf8');
            const body = `#### Project 2 Terraform Plan \`${{ env.TF_ENV }}\`
            <details><summary>Show Plan</summary>

            \`\`\`
            ${plan.slice(0, 60000)}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [plan]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.terraform_action == 'apply' && github.ref == 'refs/heads/develop')
    environment: dev
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials for Apply
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.P2_AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          cp ../../../config/backend-dev.hcl.example backend-dev.hcl
          sed -i "s/YOUR_ACCOUNT_ID/${{ secrets.AWS_ACCOUNT_ID }}/" backend-dev.hcl
          sed -i "s/YOUR_STATE_BUCKET_NAME/${{ secrets.P2_TF_STATE_BUCKET }}/" backend-dev.hcl
          sed -i "s/YOUR_LOCK_TABLE_NAME/${{ secrets.P2_TF_LOCK_TABLE }}/" backend-dev.hcl
          sed -i "s|YOUR_KMS_KEY_ARN|${{ secrets.P2_TF_STATE_KMS_KEY_ARN }}|" backend-dev.hcl
          terraform init -backend-config=backend-dev.hcl

      - name: Terraform Plan for Apply
        run: terraform plan -no-color -out=tfplan -var="bucket_suffix=${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.terraform_action == 'destroy' && github.ref == 'refs/heads/develop'
    environment: dev
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials for Destroy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.P2_AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: |
          cp ../../../config/backend-dev.hcl.example backend-dev.hcl
          sed -i "s/YOUR_ACCOUNT_ID/${{ secrets.AWS_ACCOUNT_ID }}/" backend-dev.hcl
          sed -i "s/YOUR_STATE_BUCKET_NAME/${{ secrets.P2_TF_STATE_BUCKET }}/" backend-dev.hcl
          sed -i "s/YOUR_LOCK_TABLE_NAME/${{ secrets.P2_TF_LOCK_TABLE }}/" backend-dev.hcl
          sed -i "s|YOUR_KMS_KEY_ARN|${{ secrets.P2_TF_STATE_KMS_KEY_ARN }}|" backend-dev.hcl
          terraform init -backend-config=backend-dev.hcl

      - name: Empty Terraform-managed S3 buckets
        run: ../../../scripts/empty_terraform_s3_buckets.sh

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var="bucket_suffix=${{ secrets.AWS_ACCOUNT_ID }}"
