name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7"
  TF_ENV: "dev"

defaults:
  run:
    working-directory: terraform/envs/dev

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/test_validation.py -k "not slow" --tb=short

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Format
        run: terraform fmt -check -recursive ../../..

      - name: Terraform Init
        run: |
          cp ../../../config/backend-dev.hcl.example backend-dev.hcl
          sed -i "s/YOUR_ACCOUNT_ID/${{ secrets.AWS_ACCOUNT_ID }}/" backend-dev.hcl
          sed -i "s/YOUR_STATE_BUCKET_NAME/${{ secrets.TF_STATE_BUCKET }}/" backend-dev.hcl
          sed -i "s/YOUR_LOCK_TABLE_NAME/${{ secrets.TF_LOCK_TABLE }}/" backend-dev.hcl
          sed -i "s|YOUR_KMS_KEY_ARN|${{ secrets.TF_STATE_KMS_KEY_ARN }}|" backend-dev.hcl
          terraform init -backend-config=backend-dev.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -lock=false -no-color -var="bucket_suffix=${{ secrets.AWS_ACCOUNT_ID }}"
        continue-on-error: true

      - uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Plan \`${{ env.TF_ENV }}\`
            <details><summary>Show Plan</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
